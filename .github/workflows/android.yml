name: Android CI

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - master
      - develop
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 1. Code Style / Lint Check
      - name: Run Ktlint Check
        run: ./gradlew ktlintCheck

      # 2. Compile / Build Project
      - name: Build with Gradle
        run: ./gradlew build

      # 3. Unit Testing
      - name: Run Unit Tests
        run: ./gradlew test